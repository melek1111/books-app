{% extends "base.html" %}

{% block content %}

<h1>Update Book</h1>

<form method="POST">

    <label for="title">Title:</label>
    <input
        type="text"
        id="title"
        name="title"
        value="{{ book.title }}"
        required
    >

    <br><br>

    <label for="author">Author:</label>
    <input
        type="text"
        id="author"
        name="author"
        value="{{ book.author }}"
        required
    >

    <br><br>

    <label for="year">Year:</label>
    <input
        type="number"
        id="year"
        name="year"
        value="{{ book.year }}"
        required
    >

    <br><br>

    <button type="submit">Update</button>

</form>

{% endblock %}
