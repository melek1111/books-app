{% extends "base.html" %}

{% block content %}

<h1>Books</h1>

<table>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>Year</th>
        <th>Actions</th>
    </tr>

    {% for book in books %}
    <tr>
        <td>{{ book.id }}</td>
        <td>{{ book.title }}</td>
        <td>{{ book.author }}</td>
        <td>{{ book.year }}</td>

        <td>
            <a href="{{ url_for('update_book', book_id=book.id) }}">
                Edit
            </a>

            <button onclick="deleteBook('{{ book.id }}')">
                Delete
            </button>

            <a href="{{ url_for('get_book', book_id=book.id) }}">
                Get Book
            </a>
        </td>
    </tr>
    {% endfor %}
</table>

<script>
    function deleteBook(bookId) {
        fetch(`/delete_book/${bookId}`, {
            method: "DELETE"
        })
        .then(response => {
            if (response.ok) {
                window.location.href = "/books";
            } else {
                alert("Book could not be deleted.");
            }
        });
    }
</script>

{% endblock %}
